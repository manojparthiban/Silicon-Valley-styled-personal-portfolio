<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manoj Parthiban</title>
    <meta name="description" content="Manoj Parthiban, SAP ABAP & back-end developer. Projects, experience, certifications and blog." />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080f17" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Apply the saved/system theme before first paint to avoid a light/dark flash -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.classList.add(t);
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap" />
    <link rel="preload" as="image" href="/images/profile/avatar.webp" type="image/webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // Firebase Analytics: loaded once the page is idle so it never competes with first render
      const loadAnalytics = async () => {
        const [{ initializeApp }, { getAnalytics }] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/11.3.0/firebase-analytics.js"),
        ]);
        getAnalytics(
          initializeApp({
            apiKey: "AIzaSyDiM-1_pREvBCnShXMompDgT9Ajd3vZrVE",
            authDomain: "manoj-portfolio-85f22.firebaseapp.com",
            projectId: "manoj-portfolio-85f22",
            storageBucket: "manoj-portfolio-85f22.firebasestorage.app",
            messagingSenderId: "376245011517",
            appId: "1:376245011517:web:df101d72297cd58d3b5654",
            measurementId: "G-BJ8M92SY37",
          }),
        );
      };
      const idle = window.requestIdleCallback || ((cb) => setTimeout(cb, 2000));
      addEventListener("load", () => idle(() => loadAnalytics().catch(() => {})), { once: true });
    </script>
  </body>
</html>
